name: Poll jobs
on:
  workflow_dispatch:
    inputs:
      test_email:
        description: Send the one-time email connection test
        type: boolean
        default: false
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
permissions:
  contents: write
concurrency:
  group: job-alert-state
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Poll
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          TEST_EMAIL: ${{ inputs.test_email || false }}
        run: |
          if [ -z "$EMAIL_PASSWORD" ]; then
            echo "::warning::EMAIL_PASSWORD is missing; saving pending emails without sending."
            python -m src.main --queue-email
            if [ "$TEST_EMAIL" = "true" ]; then exit 1; fi
          elif [ "$TEST_EMAIL" = "true" ]; then
            python -m src.main --email --test-email
          else
            python -m src.main --email
          fi
      - name: Persist state
        if: ${{ !cancelled() }}
        run: |
          git add data/seen_jobs.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update seen jobs"
          git pull --rebase
          git push
