name: Poll jobs
on:
  workflow_dispatch:
    inputs:
      test_sms:
        description: Send the one-time SMS connection test
        type: boolean
        default: false
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: write
concurrency:
  group: job-alert-state
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Poll
        env:
          ACCOUNT_SID: ${{ secrets.ACCOUNT_SID }}
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          TO_PHONE_NUMBER: ${{ secrets.TO_PHONE_NUMBER }}
          TEST_SMS: ${{ inputs.test_sms || false }}
        run: |
          if [ "$TEST_SMS" = "true" ]; then
            python -m src.main --sms --test-sms
          else
            python -m src.main --sms
          fi
      - name: Persist state
        if: ${{ !cancelled() }}
        run: |
          git add data/seen_jobs.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update seen jobs"
          git pull --rebase
          git push
